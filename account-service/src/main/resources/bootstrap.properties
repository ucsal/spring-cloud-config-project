# Porta do serviço
server.port=8080
# Localização do Config Server
spring.config.import=optional:configserver:http://localhost:8888
# Nome da aplicação para buscar as configs
spring.application.name=account-service-dev
# Perfil ativo: Altere entre 'dev' e 'prod' para testar as configurações diferentes
spring.profiles.active=dev
# Configuração do Actuator para Refresh Dinâmico (Requisito C)
management.endpoints.web.exposure.include=refresh